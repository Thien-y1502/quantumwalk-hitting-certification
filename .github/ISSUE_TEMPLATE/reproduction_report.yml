name: Reproduction report
description: Share the outcome of an independent run of the pipeline, whether it matches or not.
labels: [reproduction]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for checking our results. From a fresh clone, please run:

        ```bash
        pip install -r requirements.txt
        pytest -q
        python reproduce_all.py > my_run.txt
        python scripts/compare_results.py --ref-git v0.1.0
        ```
  - type: dropdown
    id: outcome
    attributes:
      label: Outcome
      options:
        - All files match
        - Some files fail the comparison
        - The pipeline did not complete
        - Installation failed
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit tested
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: OS, CPU, and Python version
      placeholder: Ubuntu 24.04, AMD Ryzen 7 5800X, Python 3.12.4
    validations:
      required: true
  - type: textarea
    id: compare
    attributes:
      label: Output of scripts/compare_results.py
      render: text
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Wall-clock time of reproduce_all.py
  - type: textarea
    id: notes
    attributes:
      label: Installation problems, unclear documentation, or other feedback
  - type: input
    id: credit
    attributes:
      label: How should we credit you in REPRODUCTIONS.md? Leave blank to stay anonymous.
